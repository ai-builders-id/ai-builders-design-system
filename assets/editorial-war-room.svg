<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">AI Builders ID Editorial War Room design language</title>
  <desc id="desc">A warm cream dot-grid canvas with editorial typography, taped sticky notes, flat color cards, and sticker and clay illustration examples.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#0a0a0a" opacity=".11"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#222936" flood-opacity=".18"/></filter>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff947f"/><stop offset="1" stop-color="#ff4d8b"/></linearGradient>
  </defs>
  <rect width="1200" height="560" rx="28" fill="#fffaf0"/>
  <rect width="1200" height="560" rx="28" fill="url(#dots)"/>
  <g font-family="Space Grotesk, Arial, sans-serif" fill="#0a0a0a">
    <text x="64" y="72" font-size="15" font-weight="700" letter-spacing="2">AI BUILDERS ID / DESIGN LANGUAGE</text>
    <text x="64" y="152" font-size="72" font-weight="700" letter-spacing="-4">Editorial</text>
    <text x="64" y="222" font-size="72" font-weight="700" letter-spacing="-4" fill="#ff6b5a">War Room.</text>
    <text x="68" y="268" font-size="19" fill="#3a3a3a">Command-center clarity, with the texture of a board built by hand.</text>
  </g>
  <path d="M65 231 C154 244 259 222 382 236" fill="none" stroke="#e8b94a" stroke-width="15" stroke-linecap="round" opacity=".62"/>
  <g filter="url(#shadow)" transform="translate(660 70) rotate(-3)">
    <rect width="205" height="178" rx="3 10 14 5" fill="#f6dbe6"/>
    <rect x="67" y="-11" width="72" height="22" rx="2" fill="#e7dbc2" opacity=".9"/>
    <text x="25" y="55" font-family="Permanent Marker, cursive" font-size="22" fill="#0a0a0a">Community</text>
    <text x="25" y="91" font-family="Space Grotesk, Arial" font-size="15" fill="#3a3a3a">Wonky edges.</text>
    <text x="25" y="116" font-family="Space Grotesk, Arial" font-size="15" fill="#3a3a3a">Tape. Notes. Voice.</text>
  </g>
  <g transform="translate(895 70)">
    <rect width="235" height="178" rx="24" fill="#1a3a3a"/>
    <text x="26" y="56" font-family="Space Grotesk, Arial" font-size="21" font-weight="700" fill="#fffaf0">Product / Trust</text>
    <text x="26" y="91" font-family="Space Grotesk, Arial" font-size="15" fill="#fffaf0">Flat geometry.</text>
    <text x="26" y="116" font-family="Space Grotesk, Arial" font-size="15" fill="#fffaf0">Clean, calm hierarchy.</text>
  </g>
  <g transform="translate(65 348)">
    <rect width="100" height="100" rx="20" fill="#ff4d8b"/><rect x="116" width="100" height="100" rx="20" fill="#b8a4ed"/>
    <rect x="232" width="100" height="100" rx="20" fill="#ffb084"/><rect x="348" width="100" height="100" rx="20" fill="#e8b94a"/>
    <rect x="464" width="100" height="100" rx="20" fill="#a4d4c5"/><rect x="580" width="100" height="100" rx="20" fill="#ff6b5a"/>
    <text y="131" font-family="Space Grotesk, Arial" font-size="14" font-weight="700" letter-spacing="1.4" fill="#3a3a3a">ONE PALETTE / TWO MATERIAL LANGUAGES</text>
  </g>
  <g transform="translate(835 320)">
    <path d="M25 12 H134 Q151 12 151 29 V111 Q151 128 134 128 H25 Q8 128 8 111 V29 Q8 12 25 12Z" fill="#e6dff7" stroke="#fffaf0" stroke-width="13" filter="url(#shadow)"/>
    <path d="M44 85 L68 59 L87 77 L111 49 L130 87Z" fill="#1a3a3a"/><circle cx="55" cy="43" r="10" fill="#e8b94a"/>
    <text x="34" y="162" font-family="Space Grotesk, Arial" font-size="14" font-weight="700" fill="#0a0a0a">STICKER / EXPLAIN</text>
    <path d="M225 28 C268 -2 327 13 336 58 C345 104 306 137 259 126 C214 116 191 64 225 28Z" fill="url(#clay)" filter="url(#shadow)"/>
    <ellipse cx="275" cy="49" rx="28" ry="15" fill="#fff" opacity=".18" transform="rotate(-18 275 49)"/>
    <text x="215" y="162" font-family="Space Grotesk, Arial" font-size="14" font-weight="700" fill="#0a0a0a">CLAY / ANIMATE</text>
  </g>
</svg>
