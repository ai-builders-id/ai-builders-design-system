-serif;\n  color: var(--ink);\n  background: var(--kraft);\n  font-weight: 400;\n  line-height: 1.55;\n  -webkit-font-smoothing: antialiased;\n}\n\n.font-hand { font-family: 'Permanent Marker', cursive; font-weight: 400; }\n.font-body { font-family: 'Space Grotesk', system-ui, sans-serif; }\n\nh1, h2, h3, h4 {\n  font-family: 'Permanent Marker', cursive;\n  font-weight: 400;\n  line-height: 1.05;\n  letter-spacing: 0.01em;\n  margin: 0;\n}\n\n/* ---- Dot grid background ---- */\n.bg-dotgrid {\n  background-image: radial-gradient(circle, hsl(220 15% 18% / 0.10) 1.2px, transparent 1.2px);\n  background-size: 24px 24px;\n}\n.bg-kraft { background: var(--kraft); }\n\n/* ---- Sketch border boxes ---- */\n.sketch-border {\n  border: 2px solid var(--ink);\n  border-radius: var(--r-sketch);\n  background: var(--card);\n}\n.sketch-border.alt { border-radius: 8px 2px 12px 4px; }\n\n/* ---- Sticky notes ---- */\n.sticky {\n  position: relative;\n  border-radius: var(--r-sticky);\n  box-shadow: var(--sticky-shadow);\n  padding: 22px 22px 26px;\n  transition: transform .22s ease, box-shadow .22s ease;\n}\n.sticky:hover { transform: rotate(0deg) scale(1.025) !important; box-shadow: var(--lift-shadow); }\n\n.tape-top::before {\n  content: \"\";\n  position: absolute;\n  top: -11px; left: 50%;\n  transform: translateX(-50%) rotate(-2deg);\n  width: 78px; height: 22px;\n  background: hsl(42 45% 88% / 0.78);\n  border: 1px solid hsl(39 25% 70% / 0.6);\n  border-radius: 2px;\n}\n\n.note-yellow { background: var(--note-yellow); }\n.note-green  { background: var(--note-green); }\n.note-pink   { background: var(--note-pink); }\n.note-blue   { background: var(--note-blue); }\n.note-orange { background: var(--note-orange); }\n.note-purple { background: var(--note-purple); }\n\n/* ---- Buttons ---- */\n.btn {\n  display: inline-flex; align-items: center; gap: 8px;\n  font-family: 'Space Grotesk', sans-serif;\n  font-weight: 700; font-size: 15px;\n  padding: 12px 22px;\n  border: 2px solid v  }\n\n/* ---- Image placeholders ---- */\n.ph {\n  position: relative;\n  background-color: var(--kraft-deep);\n  background-image: repeating-linear-gradient(45deg,\n    hsl(220 15% 18% / 0.05) 0, hsl(220 15% 18% / 0.05) 1px,\n    transparent 1px, transparent 9px);\n  border: 1.5px dashed hsl(220 15% 18% / 0.3);\n  display: flex; align-items: center; justify-content: center;\n  color: var(--ink-faint);\n  font-family: 'Space Grotesk', monospace;\n  font-size: 12px; letter-spacing: 0.04em;\n  text-transform: uppercase;\n  border-radius: 4px;\n}\n\n/* ---- Utility ---- */\n.container { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 24px; }\n.muted { color: var(--ink-soft); }\n.faint { color: var(--ink-faint); }\n.center { text-align: center; }\n\n/* scrollbar */\n::-webkit-scrollbar { width: 11px; height: 11px; }\n::-webkit-scrollbar-thumb { background: hsl(220 15% 18% / 0.22); border-radius: 999px; border: 3px solid var(--kraft); }\n::-webkit-scrollbar-track { background: transparent; }\n\n/* fade/slide-up reveal */\n@media (prefers-reduced-motion: no-preference) {\n  .reveal { opacity: 0; transform: translateY(18px); transition: opacity .6s ease, transform .6s ease; }\n  .reveal.in { opacity: 1; transform: none; }\n}\n\n<\u002Fstyle>\n<style>\n  /* ---------- Landing-specific ---------- */\n  .lp-header {\n    position: sticky; top: 0; z-index: 50;\n    background: hsl(39 30% 93% / 0.86);\n    backdrop-filter: blur(8px);\n    border-bottom: 2px solid var(--ink);\n  }\n  .lp-header .container { display: flex; align-items: center; justify-content: space-between; height: 68px; }\n  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }\n  .brand-logo { width: 46px; height: 46px; object-fit: contain; display: block; }\n  .brand-tile { width: 44px; height: 44px; border-radius: 11px 4px 11px 4px; background: var(--cream); display: grid; place-items: center; flex: none; }\n  .brand-tile img { width: 34px; height: 34p
